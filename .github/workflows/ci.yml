name: CI

# Tres jobs: `calidad` revisa el código (formato, lint, tipos, tests, generado/ al día con el contrato,
# docs/vocabulary/ al día con su TTL, publish en seco); `action` prueba la action (`uses: ./`) contra el servidor
# falso de tests/ con rutas y globs, fichas y vocabularios; `descubrimiento` prueba lo que hace sin inputs: sin repo git,
# con un repo sin fichas ni vocabularios, y con nombres parecidos a proyecto.ttl y vocabulary.ttl y rutas no ASCII.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5

      # deno.json tiene lock.frozen: si a deno.lock le falta algo, esto falla acá y no en el consumidor.
      - name: Dependencias según deno.lock
        run: deno install --frozen

      - name: Formato
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Tipos
        run: deno check mod.ts cli.ts neo4j.ts scripts/*.ts tests/*.ts ejemplos/*.ts

      - name: Tests
        run: deno task test

      # Lo commiteado en generado/ tiene que ser lo que sale del contrato commiteado.
      - name: generado/ al día con contrato/
        run: deno task generar --check

      # Lo commiteado en docs/vocabulary/ tiene que ser lo que sale de docs/vocabulary.ttl, y el TTL validar.
      - name: docs/vocabulary/ al día con docs/vocabulary.ttl
        run: deno task vocabulario --check

      - name: Publish en seco
        run: deno publish --dry-run

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5

      - name: Levantar el servidor falso
        run: |
          deno run --allow-net --allow-read tests/servidor-falso.ts --puerto 8787 --token prueba &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/openapi.json >/dev/null && exit 0
            sleep 1
          done
          echo "::error::El servidor falso no levantó"
          exit 1

      - name: Ficha conforme (tiene que pasar)
        uses: ./
        with:
          archivos: tests/fichas/conforme/proyecto.ttl
          url: http://127.0.0.1:8787
          token: prueba

      - name: Glob que solo encuentra conformes (tiene que pasar)
        uses: ./
        with:
          archivos: |
            tests/fichas/conf*/*.ttl
          url: http://127.0.0.1:8787
          token: prueba

      - name: Glob con ** que incluye la no conforme (tiene que fallar)
        id: glob_todas
        continue-on-error: true
        uses: ./
        with:
          archivos: tests/fichas/**/proyecto.ttl
          url: http://127.0.0.1:8787
          token: prueba

      - name: Vocabulario conforme, con una ficha (tiene que pasar)
        uses: ./
        with:
          archivos: tests/fichas/conforme/proyecto.ttl
          vocabularios: tests/vocabularios/conforme/vocabulary.ttl
          url: http://127.0.0.1:8787
          token: prueba

      - name: Solo vocabularios, con glob (tiene que pasar)
        uses: ./
        with:
          archivos: tests/fichas/conforme/proyecto.ttl
          vocabularios: tests/vocabularios/conf*/vocabulary.ttl
          url: http://127.0.0.1:8787
          token: prueba

      - name: Vocabulario no conforme (tiene que fallar)
        id: vocabulario_no_conforme
        continue-on-error: true
        uses: ./
        with:
          archivos: tests/fichas/conforme/proyecto.ttl
          vocabularios: tests/vocabularios/no-conforme/vocabulary.ttl
          url: http://127.0.0.1:8787
          token: prueba

      - name: Ficha no conforme (tiene que fallar)
        id: no_conforme
        continue-on-error: true
        uses: ./
        with:
          archivos: tests/fichas/no-conforme/proyecto.ttl
          url: http://127.0.0.1:8787
          token: prueba

      - name: Token malo (tiene que fallar)
        id: token_malo
        continue-on-error: true
        uses: ./
        with:
          archivos: tests/fichas/conforme/proyecto.ttl
          url: http://127.0.0.1:8787
          token: otro

      # Sin inputs: busca con git ls-files y encuentra las fichas de tests/fichas y los vocabularios de
      # tests/vocabularios (y docs/vocabulary.ttl, que al servidor falso le conforma); hay una ficha y un
      # vocabulario que no conforman.
      - name: Descubrimiento por defecto (tiene que fallar)
        id: por_defecto
        continue-on-error: true
        uses: ./
        with:
          url: http://127.0.0.1:8787
          token: prueba

      - name: Verificar los fallos esperados
        env:
          GLOB_TODAS: ${{ steps.glob_todas.outcome }}
          NO_CONFORME: ${{ steps.no_conforme.outcome }}
          VOCABULARIO_NO_CONFORME: ${{ steps.vocabulario_no_conforme.outcome }}
          TOKEN_MALO: ${{ steps.token_malo.outcome }}
          POR_DEFECTO: ${{ steps.por_defecto.outcome }}
        run: |
          fallo=0
          for caso in GLOB_TODAS NO_CONFORME VOCABULARIO_NO_CONFORME TOKEN_MALO POR_DEFECTO; do
            if [ "${!caso}" != "failure" ]; then
              echo "::error::$caso terminó en ${!caso}, se esperaba failure"
              fallo=1
            fi
          done
          exit $fallo

  # La action en un workspace que no es este repo: el checkout va a accion/ y el workspace se arma a mano.
  descubrimiento:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: accion
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5

      - name: Levantar el servidor falso
        run: |
          deno run --allow-net --allow-read accion/tests/servidor-falso.ts --puerto 8787 --token prueba &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/openapi.json >/dev/null && exit 0
            sleep 1
          done
          echo "::error::El servidor falso no levantó"
          exit 1

      # El workspace no es un repo git (como sin actions/checkout): tiene que fallar, no dar verde.
      - name: Sin repo git (tiene que fallar)
        id: sin_repo
        continue-on-error: true
        uses: ./accion
        with:
          url: http://127.0.0.1:8787
          token: prueba

      - name: Repo sin fichas
        run: git init -q

      # Un repo git sin ninguna proyecto.ttl ni vocabulary.ttl: verde con aviso.
      - name: Sin fichas ni vocabularios (tiene que pasar)
        uses: ./accion
        with:
          url: http://127.0.0.1:8787
          token: prueba

      # Solo valen los proyecto.ttl y vocabulary.ttl exactos (año/ incluido); otroproyecto.ttl, mi-proyecto.ttl,
      # mi-vocabulary.ttl y vocabularios.ttl no conforman y no se tienen que validar.
      - name: Fichas y vocabularios con nombres parecidos y rutas no ASCII
        run: |
          mkdir -p año sub
          cp accion/tests/fichas/conforme/proyecto.ttl proyecto.ttl
          cp accion/tests/fichas/conforme/proyecto.ttl año/proyecto.ttl
          cp accion/tests/vocabularios/conforme/vocabulary.ttl vocabulary.ttl
          cp accion/tests/vocabularios/conforme/vocabulary.ttl año/vocabulary.ttl
          for f in otroproyecto.ttl mi-proyecto.ttl sub/otroproyecto.ttl; do
            cp accion/tests/fichas/no-conforme/proyecto.ttl "$f"
          done
          for f in mi-vocabulary.ttl sub/vocabularios.ttl; do
            cp accion/tests/vocabularios/no-conforme/vocabulary.ttl "$f"
          done
          git add proyecto.ttl vocabulary.ttl año otroproyecto.ttl mi-proyecto.ttl mi-vocabulary.ttl sub
          git ls-files

      - name: Solo proyecto.ttl y vocabulary.ttl exactos (tiene que pasar)
        uses: ./accion
        with:
          url: http://127.0.0.1:8787
          token: prueba

      - name: Verificar el fallo esperado
        env:
          SIN_REPO: ${{ steps.sin_repo.outcome }}
        run: |
          if [ "$SIN_REPO" != "failure" ]; then
            echo "::error::SIN_REPO terminó en $SIN_REPO, se esperaba failure"
            exit 1
          fi
