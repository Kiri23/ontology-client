name: Preview

# Un preview por PR en una VM desechable de exe.dev (https://pr-ontology-client-<n>.exe.xyz/, privada: pide login de
# exe.dev). La lógica vive en Kiri23/kiriInfra (.github/workflows/preview-exe-dev.yml); acá solo se dice qué imagen y
# cómo correrla. Abrir o pushear el PR la crea o la actualiza; cerrarlo borra la VM. La URL y el commit que corre quedan
# en un solo comentario del PR, que cada push edita. Necesita el secret EXE_SSH_KEY del repo (la llave EXE_CI_SSH_KEY de
# Doppler global/dev).

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  preview:
    uses: Kiri23/kiriInfra/.github/workflows/preview-exe-dev.yml@main
    permissions:
      contents: read
      pull-requests: write
    with:
      # La imagen del explorador: Caddy en 8080 sirviendo dist/. El contexto es la raíz, porque importa el SDK.
      port: 8080
      dockerfile: explorador/Dockerfile
      context: .
      smoke-path: /explorador/
      # En el preview no hay API al lado: con API_UPSTREAM el Caddyfile manda los GET de la API a producción y la raíz
      # al explorador (solo GET, nada escribe).
      run-args: -e API_UPSTREAM=https://ontology.kiri231.com --memory=256m
    secrets:
      exe-ssh-key: ${{ secrets.EXE_SSH_KEY }}
