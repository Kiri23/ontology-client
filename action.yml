name: Validar fichas proyecto.ttl
description: >
  Valida las fichas proyecto.ttl del repo contra el servidor de ontologyLearning (POST /proyectos) y
  anota en el PR las que no conforman. El motor y las reglas son privados: viaja la ficha, vuelve el reporte.
author: Kiri23
branding:
  icon: check-circle
  color: green

inputs:
  archivos:
    description: >
      Fichas a validar: rutas o globs separados por espacios o saltos de línea. Vacío: los archivos
      llamados exactamente proyecto.ttl que git tiene en el repo (necesita actions/checkout antes); si no
      hay ninguno, sale 0 con un aviso.
    required: false
    default: ""
  url:
    description: La URL base del servidor.
    required: false
    default: https://ontology.kiri231.com
  token:
    description: El token del servidor (secreto ONTOLOGY_PROYECTOS_TOKEN). Sin token, el paso falla.
    required: true
  timeout:
    description: Segundos de espera por ficha antes de dar el servidor por caído (exit 2).
    required: false
    default: "30"

runs:
  using: composite
  steps:
    - name: Set up Deno
      uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      with:
        deno-version: v2.9.5

    - name: Validar fichas
      shell: bash
      env:
        # Los inputs van por env y nunca interpolados en el script: así no se puede inyectar shell.
        ARCHIVOS: ${{ inputs.archivos }}
        ONTOLOGY_URL: ${{ inputs.url }}
        ONTOLOGY_PROYECTOS_TOKEN: ${{ inputs.token }}
        ONTOLOGY_TIMEOUT: ${{ inputs.timeout }}
      run: |
        set -euo pipefail
        if [ -n "$ARCHIVOS" ]; then
          # Sin comillas a propósito: separa por espacios y expande globs (** incluido). Un glob que no
          # encuentra nada queda literal y el CLI falla al leerlo: mejor eso que validar cero fichas.
          shopt -s globstar
          fichas=($ARCHIVOS)
        else
          # Si git falla (sin actions/checkout no hay repo; "dubious ownership" en un container), fallar:
          # tragarse el error daría verde sin validar nada. -z: rutas crudas, sin las comillas y \303\261
          # de core.quotePath. :(glob): * no cruza / y el nombre tiene que ser proyecto.ttl exacto, no
          # otroproyecto.ttl.
          lista=$(mktemp)
          if ! git ls-files -z -- ':(glob)proyecto.ttl' ':(glob)**/proyecto.ttl' >"$lista"; then
            echo "::error title=No pude listar las fichas::git ls-files falló en $PWD. ¿Falta actions/checkout antes de esta action? (o pasá las rutas en el input archivos)"
            exit 2
          fi
          mapfile -d '' -t fichas <"$lista"
          rm -f "$lista"
        fi
        if [ "${#fichas[@]}" -eq 0 ]; then
          echo "::notice title=Sin fichas::No hay archivos proyecto.ttl en el repo: nada que validar."
          exit 0
        fi
        # --config: el deno.json de la action, no el del repo que la usa (si tiene uno).
        deno run --allow-net --allow-read --allow-env=ONTOLOGY_URL,ONTOLOGY_PROYECTOS_TOKEN,ONTOLOGY_TIMEOUT,GITHUB_ACTIONS \
          --config "$GITHUB_ACTION_PATH/deno.json" --frozen \
          "$GITHUB_ACTION_PATH/cli.ts" "${fichas[@]}"
